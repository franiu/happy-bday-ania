<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Ania's Deer Guardian 🦌</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  touch-action: none; -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  position: fixed; /* prevent iOS bounce */
}
canvas { display: block; cursor: none; }

#startScreen, #gameOverScreen, #winScreen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10; text-align: center; font-family: 'Segoe UI', Arial, sans-serif;
  padding: 20px; overflow-y: auto;
}

#startScreen {
  background: linear-gradient(180deg, #1a472a 0%, #2d5a27 40%, #4a7c3f 70%, #8fbc8f 100%);
  color: #fff;
}
#startScreen h1 {
  font-size: clamp(1.6em, 6vw, 3em);
  text-shadow: 2px 2px 8px rgba(0,0,0,0.5); margin-bottom: 10px;
}
#startScreen p {
  font-size: clamp(0.9em, 3vw, 1.2em);
  max-width: 500px; margin: 8px 20px; opacity: 0.9;
}
#startScreen .start-btn {
  margin-top: 20px; padding: 16px 40px;
  font-size: clamp(1.1em, 4vw, 1.5em); border: none;
  border-radius: 50px; background: #e8491d; color: #fff; cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s;
  min-height: 54px; /* touch-friendly minimum */
}
#startScreen .start-btn:hover { transform: scale(1.08); }
#startScreen .start-btn:active { transform: scale(0.96); }

#gameOverScreen {
  background: rgba(30, 0, 0, 0.85); color: #ff4444; display: none;
}
#gameOverScreen h1 {
  font-size: clamp(2em, 7vw, 3.5em);
  text-shadow: 0 0 20px #ff0000;
}
#gameOverScreen .score-text {
  font-size: clamp(1.2em, 4vw, 1.8em); color: #fff; margin: 15px 0;
}
#gameOverScreen .restart-btn, .restart-btn {
  margin-top: 20px; padding: 15px 40px;
  font-size: clamp(1em, 3.5vw, 1.3em); border: none;
  border-radius: 50px; background: #e8491d; color: #fff; cursor: pointer;
  min-height: 54px;
}
.restart-btn:active { transform: scale(0.96); }

#winScreen {
  background: linear-gradient(180deg, #1a1a4e 0%, #2d2d7a 50%, #4a3f7c 100%);
  color: #ffd700; display: none; position: relative;
}
#winScreen h1 { display: none; }
#winScreen .subtitle { display: none; }
/* pulseTitle no longer needed — title is canvas-drawn */

#hud {
  position: absolute; top: 0; left: 0; width: 100%;
  padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: clamp(0.85em, 3vw, 1.2em);
  color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,0.7); z-index: 5;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
}
#hud .hud-left, #hud .hud-right { display: flex; gap: 10px; }

#winCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; }

/* Safe area insets for notched phones */
@supports (padding: env(safe-area-inset-top)) {
  #hud { padding-top: max(8px, env(safe-area-inset-top)); }
  #startScreen, #gameOverScreen, #winScreen {
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>

<div id="startScreen">
  <h1>🦌 Ania's Deer Guardian 🦌</h1>
  <p>Protect the deer from giant ticks! Tap or click the ticks before they reach the deer.</p>
  <p>🎯 Swat ticks: +10 points<br>🦌 3 ticks on a deer = deer dies<br>💀 3 dead deer = game over<br>🏆 Reach 500 points to win!</p>
  <button class="start-btn" id="startBtn">🛡️ Start Game</button>
</div>

<div id="gameOverScreen">
  <h1>💀 Game Over 💀</h1>
  <p class="score-text">Score: <span id="finalScore">0</span></p>
  <button class="restart-btn" id="restartBtn">🔄 Try Again</button>
</div>

<div id="winScreen">
  <canvas id="winCanvas"></canvas>
  <button class="restart-btn" id="winRestartBtn" style="z-index:11;position:absolute;bottom:max(24px, env(safe-area-inset-bottom, 24px));left:50%;transform:translateX(-50%);">🔄 Play Again</button>
</div>

<div id="hud" style="display:none;">
  <div class="hud-left">
    <span>🎯 Score: <span id="scoreDisplay">0</span> / 500</span>
  </div>
  <div class="hud-right">
    <span>🦌 Deer lost: <span id="deerLost">0</span> / 3</span>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="game.js"></script>
</body>
</html>
